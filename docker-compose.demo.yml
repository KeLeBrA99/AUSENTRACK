# AUSENTRACK en modo demostracion: un solo contenedor, sin MySQL, con datos
# ficticios que se recargan en cada arranque.
#
#   docker compose -f docker-compose.demo.yml up --build
#
# Abre http://localhost:8000 — la pantalla de inicio muestra los usuarios de prueba.

services:
  demo:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "True"
      DB_ENGINE: sqlite
      DB_NAME: /data/demo.sqlite3
      DEBUG: "False"
      SECRET_KEY: solo-para-la-demostracion-local-no-usar-en-produccion
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "False"
